<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#050505}
  #stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#141414 0%,#070707 60%,#000 100%)}
  svg{position:absolute;inset:0}
  .crt #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 2px,rgba(255,255,255,.02) 2px 4px)}
  .crt #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
  .clean #scan,.clean #vig{display:none}
  .clean .glow{display:none}
</style></head>
<body class="crt">
<div id="stage">
<svg viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
    <clipPath id="tri"><polygon points="540,120 790,470 290,470"/></clipPath>
    <!-- horizontal slat mask for the echo layers -->
    <pattern id="slats" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#fff"/>
    </pattern>
    <mask id="slatMask"><rect width="1080" height="1080" fill="url(#slats)"/></mask>
    <g id="sun">
      <!-- retro sunset bands, gaps grow toward the base -->
      <rect x="280" y="120" width="520" height="92"  fill="#FFE14D"/>
      <rect x="280" y="218" width="520" height="62"  fill="#FFC22E"/>
      <rect x="280" y="288" width="520" height="48"  fill="#FF8F1F"/>
      <rect x="280" y="346" width="520" height="38"  fill="#FF5A26"/>
      <rect x="280" y="396" width="520" height="28"  fill="#E8303F"/>
      <rect x="280" y="438" width="520" height="18"  fill="#C21C62"/>
    </g>
    <g id="truss" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="540,120 790,470 290,470" stroke-width="18"/>
      <!-- Fink "W" webbing -->
      <polyline points="415,295 457,470 540,120 623,470 665,295" stroke-width="12"/>
    </g>
    <g id="word"><text x="540" y="700" text-anchor="middle" font-family="'Archivo Black'" font-size="215" letter-spacing="-4">FORFAR</text></g>
  </defs>

  <!-- ICON -->
  <g class="glow" opacity=".55" filter="url(#blur)">
    <g clip-path="url(#tri)"><use href="#sun"/></g>
    <use href="#truss" stroke="#fff"/>
  </g>
  <g filter="url(#soft)">
    <g clip-path="url(#tri)"><use href="#sun"/></g>
    <use href="#truss" stroke="#FFF6E5"/>
  </g>

  <!-- WORDMARK: green slatted echoes (nod to the original brand colours) -->
  <g mask="url(#slatMask)" filter="url(#soft)">
    <use href="#word" fill="#1E40AF" transform="translate(0,66)"/>
    <use href="#word" fill="#0EA5A4" transform="translate(0,44)"/>
    <use href="#word" fill="#22C55E" transform="translate(0,22)"/>
  </g>
  <g class="glow" opacity=".6" filter="url(#blur)"><use href="#word" fill="#fff"/></g>
  <!-- slight chromatic fringe -->
  <g class="glow" opacity=".35"><use href="#word" fill="#ff2a55" transform="translate(-3,0)"/><use href="#word" fill="#29e6ff" transform="translate(3,0)"/></g>
  <use href="#word" fill="#FFF8EC" filter="url(#soft)"/>

  <!-- SUBLINES -->
  <g font-family="Archivo" text-anchor="middle" filter="url(#soft)">
    <text x="540" y="842" font-size="50" font-weight="800" letter-spacing="15" fill="#FFF8EC">ROOF TRUSS CO.</text>
    <g fill="#FFB52E">
      <rect x="300" y="880" width="120" height="6"/><rect x="660" y="880" width="120" height="6"/>
      <text x="540" y="896" font-size="32" font-weight="700" letter-spacing="9">EST. 1993</text>
    </g>
  </g>
</svg>
<div id="scan"></div><div id="vig"></div>
</div>
</body></html>
